[run]
result_folder_name = brunel_si_specgate
workload_name = brunel_si
max_timestep = 1971

# Stage3-B (투기-게이팅 oracle 정밀 측정용). workload_name=brunel_si → dataset/mapping 재사용.
# result_folder_name=brunel_si_specgate → runspace/brunel_si_specgate/ 에 저장
#   (Stage3 sweep 산출 runspace/brunel_si/ 보존). sync_period 는 드라이버가 sed 로 [64]/[128] 치환.
# 계측(neurosync redo_cyc)은 additive·non-invasive → cyc/spike 출력은 Stage3 동일 T 런과 일치해야 함.

[simulation_parameter]
chip_xy = [(2,2)]
max_core_xy_in_chip = [(4,4)]
max_syn_delay = [40]
sync_period = [128]
accum_width = [2]
pretrace_engine = [10]
setup_timestep = 50     #warmup before speculation: neuron network yet to be stabilized, rollback might explode

[mapping_parameter]
ufactor = 2

[path]
simulator_path = /home/heechan/26_GRADPROJ/NeuroSync_GradProj/
mapper_path = /home/heechan/26_GRADPROJ/NeuroSync_GradProj/mapping/
workload_path = /home/heechan/26_GRADPROJ/NeuroSync_GradProj/benchmark/
runspace_path = /home/heechan/26_GRADPROJ/NeuroSync_GradProj/runspace/
