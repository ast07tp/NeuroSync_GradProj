[run]
result_folder_name = brunel_si_v2
workload_name = brunel_si
max_timestep = 1971

# brunel_si_v2: 시변(OU) Poisson 워크로드 (benchmark/brunel_si/brunel_workload_v2.py)
# workload_name=brunel_si 유지 → benchmark/brunel_si/dataset(v2가 재생성) 사용 + mapping/brunel_si 재사용
# result_folder_name=brunel_si_v2 → runspace/brunel_si_v2/ 에 저장 (v1 runspace/brunel_si 보존)
# v1 으로 롤백: example.cfg + brunel_workload.py 재생성

[simulation_parameter]
chip_xy = [(2,2)]
max_core_xy_in_chip = [(4,4)]
max_syn_delay = [40]
sync_period = [16]
accum_width = [2]
pretrace_engine = [10]
setup_timestep = 50     #warmup before speculation: neuron network yet to be stabilized, rollback might explode

[mapping_parameter]
ufactor = 2

[path]
simulator_path = /home/heechan/26_GRADPROJ/NeuroSync_GradProj/
mapper_path = /home/heechan/26_GRADPROJ/NeuroSync_GradProj/mapping/
workload_path = /home/heechan/26_GRADPROJ/NeuroSync_GradProj/benchmark/
runspace_path = /home/heechan/26_GRADPROJ/NeuroSync_GradProj/runspace/
